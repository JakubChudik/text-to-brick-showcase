<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 946" width="1200" height="946" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><symbol id="s" viewBox="0 0 200 14"><rect x="22" y="0" width="26" height="14" rx="4"/><rect x="66" y="0" width="26" height="14" rx="4"/><rect x="110" y="0" width="26" height="14" rx="4"/><rect x="154" y="0" width="26" height="14" rx="4"/></symbol></defs>
<g font-size="13" font-weight="700" letter-spacing="2" fill="#7a8394"><text x="40" y="30">WHAT WE OPTIMISE</text><text x="610" y="30">HOW WE CHECK IT · AND WHY, IN THE OWNER'S WORDS</text></g>
<text x="40" y="52" font-size="13" fill="#7a8394">Badges: the order trade-offs are settled in (owner, 19 Oct 2026). ★ = learned from blind picks.</text>
<text x="40" y="90" font-size="12" font-weight="700" letter-spacing="1.5" fill="#d6372d">WHAT PEOPLE SEE</text>
<g fill="#d6372d"><use href="#s" x="110" y="100" width="380" height="14"/><rect x="80" y="112" width="440" height="70" rx="8"/></g>
<circle cx="110" cy="147" r="16" fill="#fff"/><text x="110" y="153" font-size="17" font-weight="800" fill="#d6372d" text-anchor="middle">1</text>
<text x="138" y="143" font-size="19" font-weight="700" fill="#fff">Recognisable and lifelike</text>
<text x="138" y="166" font-size="14" fill="#fde4e1">the hero drawn true; real parts for real things</text>
<text x="610" y="130" font-size="14" fill="#3a3f4a">A blind judge must name the subject from the picture alone; must-read</text>
<text x="610" y="149" font-size="14" fill="#3a3f4a">features are measured in pixels at the hero camera.</text>
<text x="610" y="174" font-size="13.5" font-style="italic" fill="#b3261e">&quot;an amazing build that&#x27;s very lifelike, where you can see what you have built&quot;</text>
<g fill="#d6372d"><use href="#s" x="110" y="204" width="380" height="14"/><rect x="80" y="216" width="440" height="70" rx="8"/></g>
<circle cx="110" cy="251" r="16" fill="#fff"/><text x="110" y="257" font-size="17" font-weight="800" fill="#d6372d" text-anchor="middle">★</text>
<text x="138" y="247" font-size="19" font-weight="700" fill="#fff">A moment, in scenes within scenes</text>
<text x="138" y="270" font-size="14" fill="#fde4e1">one moment → 3–6 smaller scenes → 4–12 little stories</text>
<text x="610" y="234" font-size="14" fill="#3a3f4a">A scene plan for every build: at least 80 % of the planned stories must</text>
<text x="610" y="253" font-size="14" fill="#3a3f4a">be in the model and seen by a camera; each smaller scene is judged alone.</text>
<text x="610" y="278" font-size="13.5" font-style="italic" fill="#b3261e">&quot;there&#x27;s a lot of stuff that&#x27;s happening there, and I totally love it&quot;</text>
<g fill="#d6372d"><use href="#s" x="110" y="308" width="380" height="14"/><rect x="80" y="320" width="440" height="70" rx="8"/></g>
<circle cx="110" cy="355" r="16" fill="#fff"/><text x="110" y="361" font-size="17" font-weight="800" fill="#d6372d" text-anchor="middle">★</text>
<text x="138" y="351" font-size="19" font-weight="700" fill="#fff">A place, good from every side</text>
<text x="138" y="374" font-size="14" fill="#fde4e1">designed ground, depth, scale cues, a composed back</text>
<text x="610" y="338" font-size="14" fill="#3a3f4a">Bare ground is measured per scene; back cameras are planned and checked;</text>
<text x="610" y="357" font-size="14" fill="#3a3f4a">four fixed views and close-ups go to every review.</text>
<text x="610" y="382" font-size="13.5" font-style="italic" fill="#b3261e">&quot;I bet when we look from multiple angles [it] looks better&quot;</text>
<text x="40" y="416" font-size="12" font-weight="700" letter-spacing="1.5" fill="#b38600">HOW IT FEELS TO BUILD</text>
<g fill="#f2b705"><use href="#s" x="90" y="426" width="420" height="14"/><rect x="60" y="438" width="480" height="70" rx="8"/></g>
<circle cx="90" cy="473" r="16" fill="#fff"/><text x="90" y="479" font-size="17" font-weight="800" fill="#f2b705" text-anchor="middle">3</text>
<text x="118" y="469" font-size="19" font-weight="700" fill="#2b2306">Consistent, but varied</text>
<text x="118" y="492" font-size="14" fill="#4a3d0a">calm colour; every structure and figure its own</text>
<text x="610" y="456" font-size="14" fill="#3a3f4a">The colour plan is solved first, capped by set size; touching structures</text>
<text x="610" y="475" font-size="14" fill="#3a3f4a">must differ in colour and kind of part (banded on 133 official sets).</text>
<text x="610" y="500" font-size="13.5" font-style="italic" fill="#b3261e">&quot;of various height and build so there is diversity to them as in to people&quot;</text>
<g fill="#f2b705"><use href="#s" x="90" y="530" width="420" height="14"/><rect x="60" y="542" width="480" height="70" rx="8"/></g>
<circle cx="90" cy="577" r="16" fill="#fff"/><text x="90" y="583" font-size="17" font-weight="800" fill="#f2b705" text-anchor="middle">4</text>
<text x="118" y="573" font-size="19" font-weight="700" fill="#2b2306">Fun to build</text>
<text x="118" y="596" font-size="14" fill="#4a3d0a">new techniques every bag; each bag ends in a reveal</text>
<text x="610" y="560" font-size="14" fill="#3a3f4a">A build-experience score per bag of about 200 parts: seven components,</text>
<text x="610" y="579" font-size="14" fill="#3a3f4a">each banded on 148 official sets (494 bags). Below the band = monotony.</text>
<text x="610" y="604" font-size="13.5" font-style="italic" fill="#b3261e">&quot;the entropy of the build ... brick types, brick colours, jaggedness and layout patterns&quot;</text>
<text x="40" y="638" font-size="12" font-weight="700" letter-spacing="1.5" fill="#2f6fd0">MUST PASS · NEVER TRADED</text>
<g fill="#2f6fd0"><use href="#s" x="70" y="648" width="460" height="14"/><rect x="40" y="660" width="520" height="70" rx="8"/></g>
<circle cx="70" cy="695" r="16" fill="#fff"/><text x="70" y="701" font-size="17" font-weight="800" fill="#2f6fd0" text-anchor="middle">2</text>
<text x="98" y="691" font-size="19" font-weight="700" fill="#fff">Structurally sound</text>
<text x="98" y="714" font-size="14" fill="#e6eefc">stands on a table; every step rests on the last</text>
<text x="610" y="678" font-size="14" fill="#3a3f4a">A force-balance solve over every stud connection, with grip to spare;</text>
<text x="610" y="697" font-size="14" fill="#3a3f4a">then a proof that each building step rests on the steps before it.</text>
<text x="610" y="722" font-size="13.5" font-style="italic" fill="#b3261e">&quot;models can be tilted, that is not a test we need to pass&quot; (so the table is the gate)</text>
<g fill="#2f6fd0"><use href="#s" x="70" y="752" width="460" height="14"/><rect x="40" y="764" width="520" height="70" rx="8"/></g>
<circle cx="70" cy="799" r="16" fill="#fff"/><text x="70" y="805" font-size="17" font-weight="800" fill="#2f6fd0" text-anchor="middle">2</text>
<text x="98" y="795" font-size="19" font-weight="700" fill="#fff">Buildable</text>
<text x="98" y="818" font-size="14" fill="#e6eefc">real parts, made in that colour, on real studs</text>
<text x="610" y="782" font-size="14" fill="#3a3f4a">Collisions on the parts&#x27; true shapes, connections, part and colour</text>
<text x="610" y="801" font-size="14" fill="#3a3f4a">availability. A check that could not run says &quot;not checked&quot;, never &quot;pass&quot;.</text>
<text x="610" y="826" font-size="13.5" font-style="italic" fill="#7a8394">Our rule: never silently succeed or fail.</text>
<rect x="20" y="860" width="560" height="16" rx="4" fill="#2e9d5b"/>
<circle cx="56" cy="868" r="13" fill="#fff" stroke="#2e9d5b" stroke-width="3"/><text x="56" y="873" font-size="14" font-weight="800" fill="#2e9d5b" text-anchor="middle">5</text>
<text x="40" y="900" font-size="15" font-weight="700" fill="#2e9d5b">On a baseplate of cost: a part range per prompt, small scenes ≤ +10 % parts,</text>
<text x="40" y="920" font-size="15" font-weight="700" fill="#2e9d5b">and a design approved before the slow strength proof runs.</text>
<text x="610" y="874" font-size="14" fill="#3a3f4a">Part count is a cost to keep reasonable, never the goal:</text>
<text x="610" y="896" font-size="13.5" font-style="italic" fill="#b3261e">"Our goal is not to minimize the number of bricks"</text>
</svg>