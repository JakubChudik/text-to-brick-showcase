<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a8394"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d6372d"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e9d5b"/></marker>
    <symbol id="s" viewBox="0 0 200 14"><rect x="22" y="0" width="26" height="14" rx="4"/><rect x="66" y="0" width="26" height="14" rx="4"/><rect x="110" y="0" width="26" height="14" rx="4"/><rect x="154" y="0" width="26" height="14" rx="4"/></symbol>
  </defs>

  <!-- cost ruler: cheap first, expensive last -->
  <g font-size="12" font-weight="700" letter-spacing="1.5" fill="#7a8394">
    <text x="40" y="28">SECONDS, NO HUMAN</text>
    <text x="600" y="28" text-anchor="middle">MINUTES, A MODEL</text>
    <text x="1160" y="28" text-anchor="end">THE OWNER'S EYE</text>
  </g>
  <path d="M40 40 H1154" stroke="#c9ced8" stroke-width="2" marker-end="url(#a)"/>

  <!-- 1 candidate -->
  <g fill="#2f6fd0"><use href="#s" x="40" y="66" width="230" height="14"/><rect x="40" y="78" width="230" height="110" rx="8"/></g>
  <text x="58" y="110" font-size="18" font-weight="700" fill="#fff">1 · A candidate</text>
  <text x="58" y="134" font-size="14" fill="#e6eefc">one piece of the scene,</text>
  <text x="58" y="153" font-size="14" fill="#e6eefc">from the plan, the rules</text>
  <text x="58" y="172" font-size="14" fill="#e6eefc">and recipes kept so far</text>

  <!-- 2 hard gates -->
  <g fill="#2f6fd0"><use href="#s" x="330" y="66" width="230" height="14"/><rect x="330" y="78" width="230" height="110" rx="8"/></g>
  <text x="348" y="110" font-size="18" font-weight="700" fill="#fff">2 · Hard gates</text>
  <text x="348" y="134" font-size="14" fill="#e6eefc">fits · connects · exists</text>
  <text x="348" y="153" font-size="14" fill="#e6eefc">in that colour · stands</text>
  <text x="348" y="172" font-size="14" fill="#e6eefc">fail → fixed, never shown</text>

  <!-- 3 scores -->
  <g fill="#f2b705"><use href="#s" x="620" y="66" width="250" height="14"/><rect x="620" y="78" width="250" height="110" rx="8"/></g>
  <text x="638" y="110" font-size="18" font-weight="700" fill="#2b2306">3 · Scores &amp; critic</text>
  <text x="638" y="134" font-size="14" fill="#4a3d0a">fun-to-build bands, variety,</text>
  <text x="638" y="153" font-size="14" fill="#4a3d0a">stories visible, likeness;</text>
  <text x="638" y="172" font-size="14" fill="#4a3d0a">a critic against the rules</text>

  <!-- 4 owner -->
  <g fill="#d6372d"><use href="#s" x="930" y="66" width="230" height="14"/><rect x="930" y="78" width="230" height="110" rx="8"/></g>
  <text x="948" y="110" font-size="18" font-weight="700" fill="#fff">4 · Blind pick</text>
  <text x="948" y="134" font-size="14" fill="#fde4e1">two pictures, no names:</text>
  <text x="948" y="153" font-size="14" fill="#fde4e1">"which would you rather</text>
  <text x="948" y="172" font-size="14" fill="#fde4e1">build?" and why, in words</text>

  <g stroke="#7a8394" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M272 133 H322"/>
    <path d="M562 133 H612"/>
    <path d="M872 133 H922"/>
  </g>

  <!-- redo: only that piece -->
  <path d="M1045 192 V238 H155 V196" stroke="#d6372d" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#ar)"/>
  <text x="600" y="232" font-size="14" font-weight="700" fill="#d6372d" text-anchor="middle">redo → rebuild only that piece · keep → frozen, never touched again</text>

  <!-- learning: words become machinery -->
  <g fill="#2e9d5b"><use href="#s" x="330" y="290" width="540" height="14"/><rect x="330" y="302" width="540" height="104" rx="8"/></g>
  <text x="600" y="334" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5 · The owner's words become machinery</text>
  <text x="600" y="360" font-size="14" fill="#e3f5ea" text-anchor="middle">a taste rule → a check or a score → a reusable recipe or kit</text>
  <text x="600" y="381" font-size="14" fill="#e3f5ea" text-anchor="middle">so the next candidate already passes what the last one was told</text>

  <path d="M1045 192 V354 H878" stroke="#2e9d5b" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" fill="none" marker-end="url(#ag)"/>
  <path d="M322 354 H155 V196" stroke="#2e9d5b" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" fill="none" marker-end="url(#ag)"/>
  <text x="150" y="380" font-size="13" font-weight="700" fill="#2e9d5b">feeds steps 1–3</text>

  <text x="600" y="456" font-size="15" fill="#3a3f4a" text-anchor="middle">Simple on the outside: one question per round. Complex inside: every check runs before a person spends a second,</text>
  <text x="600" y="478" font-size="15" fill="#3a3f4a" text-anchor="middle">and every answer is kept, so the expensive part (the owner's attention) only ever judges what the machine cannot.</text>
</svg>
